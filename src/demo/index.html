<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PHP WASM</title>
    <link rel="preload" href="/phpw.mjs" as="script" type="application/javascript">
    <link rel="preload" href="/phpw.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
</head>
<body style="margin:0; padding:0;overflow:hidden;width:100vw;height:100vh;">
<iframe id="frame" style="border:0;padding:0;width:100vw;height:100vh;"></iframe>
<script type="module">
    const [moduleLoader, wasmBinary] = await Promise.all([
        import("/phpw.mjs"),
        fetch('/phpw.wasm', { credentials: 'same-origin' })
            .then(r => r.ok ? r.arrayBuffer() : Promise.reject(`HTTP error! status: ${r.status}`))
            .catch(e => { throw new Error(`Error loading WebAssembly: ${e.message}`) })
    ]);
    let phpBuffer = [];
    const php = await moduleLoader.default({
        wasmBinary: wasmBinary,
        print: (data) => phpBuffer.push(data),
        noInitialRun: true
    });
    window.php = php;
    php.FS.writeFile("/www/phpinfo.php", "<?php phpinfo(); ?>");
    phpBuffer = [];
    php.ccall("phpw_run", null, ["string"], ["/www/phpinfo.php"]);
    const frame = document.getElementById("frame");
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open();
    doc.write(phpBuffer.join(""));
    doc.close();
</script>
</body>
</html>
