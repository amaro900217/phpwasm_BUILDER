;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP.INI OPTIMIZADO PARA PHP-WASM                                ;
; Configuración específica para WebAssembly con máximo rendimiento ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[PHP]

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;

; Tiempo máximo de ejecución (30s es razonable para WASM en navegador)
max_execution_time = 30

; Tiempo máximo de parsing de input (reducido para WASM)
max_input_time = 10

; Memoria máxima por script (alineado con MAXIMUM_MEMORY=512mb del .def)
; Dejamos margen para el runtime de WASM
memory_limit = 256M

;;;;;;;;;;;;;;;
; Performance ;
;;;;;;;;;;;;;;;

; Deshabilitar realpath_cache en WASM
realpath_cache_size = 0
realpath_cache_ttl = 0

; Desactivar Garbage Collection para rendimiento en scripts cortos
zend.enable_gc = Off

; Deshabilitar assertions
zend.assertions = -1
assert.active = Off
assert.exception = Off
assert.warning = Off

;;;;;;;;;;;;;;;;;;;
; Error Handling  ;
;;;;;;;;;;;;;;;;;;;

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = Off
html_errors = Off
report_memleaks = Off

;;;;;;;;;;;;;;;
; Data Limits ;
;;;;;;;;;;;;;;;

post_max_size = 1M
upload_max_filesize = 1M
max_file_uploads = 0
max_input_vars = 100
max_input_nesting_level = 64

;;;;;;;;;;;;;;;;
; File Uploads ;
;;;;;;;;;;;;;;;;

; Deshabilitar uploads para ahorrar memoria
file_uploads = Off
upload_tmp_dir = /tmp

;;;;;;;;;;;;;;;;;;;
; Output Control  ;
;;;;;;;;;;;;;;;;;;;

; Sin buffer de salida
output_buffering = Off
implicit_flush   = Off
ob_implicit_flush = Off
zlib.output_compression = Off

;;;;;;;;;;;;;;;
; Sessions    ;
;;;;;;;;;;;;;;;

; Session no está compilado con --disable-all
; Se han eliminado las directivas session.*

;;;;;;;;;;;;;;;
; Security    ;
;;;;;;;;;;;;;;;

disable_functions = dl,system,exec,passthru,shell_exec,proc_open,popen
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

;;;;;;;;;;;;;;;
; Extensions  ;
;;;;;;;;;;;;;;;

; Las extensiones están compiladas estáticamente en WASM

; Configuración de JSON (Obligatorio en PHP 8)
; [json]
; json.exception = On

; Configuración de Date (Obligatorio en PHP 8)
; [Date]
date.timezone = UTC

; Opcache (Deshabilitado explícitamente)
; Opcache (Deshabilitado explícitamente y estrangulado)
[opcache]
opcache.enable = 0
opcache.enable_cli = 0
opcache.memory_consumption = 0
opcache.max_accelerated_files = 0
opcache.interned_strings_buffer = 0
opcache.validate_timestamps = 0
opcache.save_comments = 0
opcache.file_cache_consistency_checks = Off
opcache.memory_consumption = 8
opcache.use_cwd = Off

;;;;;;;;;;;;;;;;;;;;;;;
; WASM Optimizations  ;
;;;;;;;;;;;;;;;;;;;;;;;

; Optimizar para scripts de corta duración
; En WASM cada request puede ser un nuevo contexto
max_input_time = 10
default_socket_timeout = 10

;;;;;;;;;;;;;;;;;;;
; Miscellaneous   ;
;;;;;;;;;;;;;;;;;;;

; Precisión de punto flotante
precision = -1
serialize_precision = -1

; Default charset
default_charset = "UTF-8"

; Deshabilitar mail() (no funciona en WASM)
; sendmail_path =

; Variables de entorno
variables_order = "EGPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = Off

; CUSTOM
enable_dl = Off
enable_post_data_reading = Off
zend.detect_unicode = Off
pcre.jit = Off
fatal_error_backtraces = Off
extension_dir = ""

; Include path
include_path = ".:/src"

; Directorio temporal
sys_temp_dir = "/tmp"

; Deshabilitar ignore_user_abort (no aplicable en WASM)
ignore_user_abort = Off

; Habilitar short open tags (opcional, mejor usar <?php)
short_open_tag = Off

; Deshabilitar ASP tags
asp_tags = Off
