;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP.INI OPTIMIZADO PARA PHP-WASM                                ;
; Configuración específica para WebAssembly con máximo rendimiento ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[PHP]

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;

; Tiempo máximo de ejecución (30s es razonable para WASM en navegador)
max_execution_time = 30

; Tiempo máximo de parsing de input (reducido para WASM)
max_input_time = 10

; Memoria máxima por script (alineado con MAXIMUM_MEMORY=512mb del .def)
; Dejamos margen para el runtime de WASM
memory_limit = 256M

;;;;;;;;;;;;;;;
; Performance ;
;;;;;;;;;;;;;;;

; Deshabilitar realpath_cache en WASM (el VFS es efímero)
realpath_cache_size = 0
realpath_cache_ttl = 0

; Deshabilitar stat cache (el filesystem virtual es pequeño y rápido)
; En WASM no hay I/O de disco real, así que el caching no aporta
; NOTA: Esto puede ser contraproducente si usas IDBFS con muchos archivos
; Ajusta según tu caso de uso
; realpath_cache_size = 4096K
; realpath_cache_ttl = 120

; Optimizar garbage collection
zend.enable_gc = On

; Deshabilitar assertions en producción (ya está en ASSERTIONS=0 del .def)
zend.assertions = -1
assert.active = Off

;;;;;;;;;;;;;;;;;;;
; Error Handling  ;
;;;;;;;;;;;;;;;;;;;

; En desarrollo, habilita errores. En producción, desactiva display_errors
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On

; No hay archivo de log en WASM por defecto (usa console)
; error_log = /tmp/php_errors.log

; Deshabilitar HTML errors (para APIs JSON)
html_errors = Off

;;;;;;;;;;;;;;;
; Data Limits ;
;;;;;;;;;;;;;;;

; Límites de POST/Upload (ajusta según necesidad)
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 20

; Variables de input (reducido para WASM)
max_input_vars = 1000
max_input_nesting_level = 64

;;;;;;;;;;;;;;;;
; File Uploads ;
;;;;;;;;;;;;;;;;

; Habilitar uploads (se guardan en MEMFS por defecto)
file_uploads = On
upload_tmp_dir = /tmp

;;;;;;;;;;;;;;;;;;;
; Output Control  ;
;;;;;;;;;;;;;;;;;;;

; Buffer de salida (optimizado para respuestas rápidas)
output_buffering = 4096
implicit_flush = Off

; Compresión de salida (deshabilitada, mejor manejar en JS)
zlib.output_compression = Off

;;;;;;;;;;;;;;;
; Sessions    ;
;;;;;;;;;;;;;;;

; Configuración de sesiones (usar MEMFS o IDBFS)
session.save_handler = files
session.save_path = "/tmp"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440
session.cache_limiter = nocache
session.cache_expire = 180

; Lazy write (mejora performance)
session.lazy_write = On

;;;;;;;;;;;;;;;
; Security    ;
;;;;;;;;;;;;;;;

; Deshabilitar funciones peligrosas (no aplicables en WASM de todas formas)
disable_functions = 

; Deshabilitar clases peligrosas
disable_classes =

; Ocultar versión de PHP
expose_php = Off

; Deshabilitar URL includes (seguridad)
allow_url_fopen = On
allow_url_include = Off

;;;;;;;;;;;;;;;
; Extensions  ;
;;;;;;;;;;;;;;;

; Las extensiones están compiladas estáticamente en WASM
; No es necesario cargar .so dinámicamente

; Configuración de mbstring (compilado con --enable-mbstring)
[mbstring]
mbstring.language = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.http_input = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off
mbstring.detect_order = auto
mbstring.substitute_character = none

; Configuración de JSON
[json]
; json.exception = On  ; PHP 8.3+

; Configuración de PDO SQLite
[pdo_sqlite]
; pdo_sqlite.defensive = 1  ; PHP 8.3+

; Configuración de Session
[Session]
; Ya configurado arriba

; Configuración de Date
[Date]
date.timezone = UTC

; Configuración de filter
[filter]
filter.default = unsafe_raw
filter.default_flags =

;;;;;;;;;;;;;;;;;;;;;;;
; WASM Optimizations  ;
;;;;;;;;;;;;;;;;;;;;;;;

; Deshabilitar opcache (no disponible en WASM sin JIT)
; opcache.enable = 0
; opcache.enable_cli = 0

; Optimizar para scripts de corta duración
; En WASM cada request puede ser un nuevo contexto
max_input_time = 10
default_socket_timeout = 10

;;;;;;;;;;;;;;;;;;;
; Miscellaneous   ;
;;;;;;;;;;;;;;;;;;;

; Precisión de punto flotante
precision = 14
serialize_precision = -1

; Default charset
default_charset = "UTF-8"

; Deshabilitar mail() (no funciona en WASM)
; sendmail_path =

; Variables de entorno
variables_order = "EGPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

; Include path
include_path = ".:/src"

; Directorio temporal
sys_temp_dir = "/tmp"

; Deshabilitar ignore_user_abort (no aplicable en WASM)
ignore_user_abort = Off

; Habilitar short open tags (opcional, mejor usar <?php)
short_open_tag = Off

; Deshabilitar ASP tags
asp_tags = Off
